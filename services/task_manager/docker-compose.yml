services:

  # ── Task Manager API ────────────────────────────────────────────────────────
  task-manager:
    build:
      context: ../..
      dockerfile: services/task_manager/task_manager/Dockerfile
    image: data-platform-task-manager:latest
    deploy:
      replicas: 1
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./pipeline_definitions:/opt/pipeline_definitions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Controller — 1 replica, Redis leader-locked ─────────────────────────────
  controller:
    build:
      context: ../..
      dockerfile: services/task_manager/controller/Dockerfile
    image: data-platform-controller:latest
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    restart: unless-stopped

  # ── Watchdog — 1 replica, Redis leader-locked ───────────────────────────────
  watchdog:
    build:
      context: ../..
      dockerfile: services/task_manager/watchdog/Dockerfile
    image: data-platform-watchdog:latest
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    restart: unless-stopped

networks:
  # Same network the root docker-compose.yml creates, and the one DOCKER_NETWORK
  # names — pipeline containers launched by DockerRuntime must land on it to
  # reach kafka/clickhouse. Bring the root stack up first (it creates it).
  backend:
    name: data-platform_backend
    external: true
