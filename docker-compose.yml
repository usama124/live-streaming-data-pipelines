services:

  # ── Infrastructure ──────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Official Apache image, pinned. bitnami/kafka:latest no longer resolves —
    # Bitnami retired those tags to bitnamilegacy/, which gets no updates.
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      - KAFKA_NODE_ID=0
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=data_platform
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ── Task Manager ─────────────────────────────────────────────────────────

  task-manager:
    build:
      context: .
      dockerfile: services/task_manager/task_manager/Dockerfile
    image: data-platform-task-manager:latest
    container_name: task-manager
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RUNTIME_MODE=docker
      - DOCKER_NETWORK=data-platform_backend
      - PRODUCER_IMAGE=data-platform-producer:latest
      - AIRFLOW_ENABLED=false
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=data_platform
      - CLICKHOUSE_TABLE=pipeline_events
      # ── Folder watcher ──────────────────────────────────────────────────
      - PIPELINE_DEFINITIONS_DIR=/opt/pipeline_definitions
      - WATCHER_POLL_INTERVAL_S=5
      - WATCHER_ENABLED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount a local directory so your backend can drop definition files in.
      # Change ./pipeline_definitions to wherever your backend writes files.
      - ./pipeline_definitions:/opt/pipeline_definitions
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped
    # Without this, `docker compose up --wait` returns while uvicorn is still
    # binding. python is the one HTTP client guaranteed to be in the image.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── Controller — acts on desired_state, starts/stops pipeline containers ──
  # Deleted in Phase 3, when Kubernetes owns reconciliation. Without it the API
  # records desired_state and nothing ever launches.

  controller:
    build:
      context: .
      dockerfile: services/task_manager/controller/Dockerfile
    image: data-platform-controller:latest
    container_name: controller
    environment:
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - RUNTIME_MODE=docker
      - DOCKER_NETWORK=data-platform_backend
      - PRODUCER_IMAGE=data-platform-producer:latest
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=data_platform
      - CLICKHOUSE_TABLE=pipeline_events
      - CONTROLLER_INTERVAL_S=3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # ── Consumer pool — shared by every live pipeline ────────────────────────
  # One deployment, pattern-subscribed to pipeline.*.events. A new pipeline's
  # topic is picked up without restarting this; nothing registers with it.

  consumer-pool:
    build:
      context: .
      dockerfile: services/consumer_pool/Dockerfile
    image: data-platform-consumer-pool:latest
    container_name: consumer-pool
    ports:
      - "9100:9100"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USERNAME=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DATABASE=data_platform
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  # ── OPC UA mock server (dev/CI — remove in production) ──────────────────

  opcua-mock:
    build:
      context: .
      dockerfile: services/producer_service/Dockerfile
    image: data-platform-producer:latest
    container_name: opcua-mock
    entrypoint: ["python3", "-m", "connectors.opcua.mock_server"]
    working_dir: /opt
    environment:
      - PYTHONPATH=/opt
    ports:
      - "4840:4840"
    networks:
      - backend
    profiles:
      - opcua
    restart: unless-stopped

  # ── Image build targets (not started normally) ───────────────────────────

  producer-template:
    build:
      context: .
      dockerfile: services/producer_service/Dockerfile
    image: data-platform-producer:latest
    profiles:
      - templates
    command: ["python", "-c", "print('producer image build target only')"]
    networks:
      - backend

networks:
  backend:
    name: data-platform_backend

volumes:
  redis-data:
  kafka-data:
  clickhouse-data: