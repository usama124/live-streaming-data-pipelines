# The shared consumer pool. One Deployment for every live pipeline, not one per
# pipeline — it subscribes to pipeline.*.events by pattern, so a new pipeline
# needs no change here and no restart.
#
# Replica count is a throughput decision, not a lifecycle one: pipelines are
# started and stopped by scaling their *producer*, never this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-pool
  labels:
    app: consumer-pool
    managed-by: task-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: consumer-pool
  template:
    metadata:
      labels:
        app: consumer-pool
    spec:
      restartPolicy: Always
      containers:
        - name: consumer-pool
          image: data-platform-consumer-pool:latest
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: data-platform-secrets
                  key: redis-url
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_DATABASE
              value: data_platform
          ports:
            - name: metrics
              containerPort: 9100
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
